<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İtfaiye Yapay Zekâ Kılavuzu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="wrap">
  <a class="brand" href="/">🚒 <span>İtfaiye Yapay Zekâ Kılavuzu</span></a>
  <nav>
  {% if user %}<a href="/">Kılavuz / Soru Sor</a><a href="/gecmisim">Geçmişim</a><span class="who">{{user['username']}}</span>{% if user['role']=='admin'%}<a href="/admin">Yönetim</a>{% endif %}<a href="/change-password">Şifre Değiştir</a><a href="/logout" class="logout">Çıkış</a>
  {% else %}<a href="/login">Giriş</a><a href="/register" class="button-nav">Kayıt</a>{% endif %}
  </nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="site-footer"><div class="wrap">
  <span>Bu sayfa tamamıyla <strong>Abdullah KARADUMAN</strong> tarafından düşünülüp yapılmıştır.</span>
</div></footer>
</body></html>
