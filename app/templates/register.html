{% extends "base.html" %}{% block content %}<div class="card narrow"><h1>Kayıt Ol</h1>
<p class="muted">Kayıt olduktan sonra hesabınız bir yönetici onaylayana kadar giriş yapamazsınız.</p>
{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{csrf}}">
<label>Kullanıcı adı</label><input name="username" minlength="3" required autocomplete="username">
<label>E-posta</label><input type="email" name="email" required autocomplete="email">
<label>Şifre</label><input type="password" name="password" minlength="8" required autocomplete="new-password"><button>Kayıt Ol</button></form></div>{% endblock %}
