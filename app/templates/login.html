{% extends "base.html" %}{% block content %}<div class="card narrow"><h1>Giriş Yap</h1>
{% if registered %}<div class="ok">Kayıt alındı. Hesabınız kullanılabilir olmadan önce bir yöneticinin onaylaması gerekir.</div>{% endif %}
{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{csrf}}">
<label>Kullanıcı adı</label><input name="username" required autocomplete="username">
<label>Şifre</label><input type="password" name="password" required autocomplete="current-password"><button>Giriş Yap</button></form></div>{% endblock %}
