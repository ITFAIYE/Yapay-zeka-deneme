{% extends "base.html" %}{% block content %}<div class="card narrow"><h1>Şifre Değiştir</h1>
{% if forced %}<div class="error">Devam etmeden önce şifrenizi değiştirmeniz gerekiyor.</div>{% endif %}
{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{csrf}}">
<label>Mevcut şifre</label><input type="password" name="current_password" required autocomplete="current-password">
<label>Yeni şifre</label><input type="password" name="new_password" minlength="8" required autocomplete="new-password">
<label>Yeni şifre (tekrar)</label><input type="password" name="new_password2" minlength="8" required autocomplete="new-password">
<button>Şifreyi Güncelle</button></form></div>{% endblock %}
